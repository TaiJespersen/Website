<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noindex">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tai Jespersen</title>
  <meta name="description" content="Website for Graduate student Tai Jespersen" />
  <meta name="author" content="Tai Jespersen" />

  <!-- Website Icon -->
  <link rel="icon" type="image/jpeg" href="./Icon.jpg">

  <!-- Stylesheets (Relative Paths for GitHub Pages compatibility) -->
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/modals.css" />

  <!-- 3D & UI Libraries via High-Speed CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>
</head>
<body>
  <!-- CRT Retro Scanline Grid Effect -->
  <div class="crt-scanlines"></div>

  <!-- 3D WebGL Canvas Viewport -->
  <div id="canvas-container"></div>

  <!-- React 18 Application Root -->
  <div id="react-root"></div>

  <!-- Application Logic Scripts (Relative Paths) -->
  <script src="./js/data.js"></script>
  <script src="./js/audio.js"></script>
  <script src="./js/simulations.js"></script>
  <script src="./js/celestial.js"></script>
  <script src="./js/ship.js"></script>
  <script src="./js/scene.js"></script>

  <!-- React JSX Application (Transpiled client-side via Babel for static GitHub Pages) -->
  <script type="text/babel" src="./js/app.jsx"></script>

  <!-- Initialize 3D Universe on Load -->
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      if (window.AstroScene && window.THREE) {
        window.AstroScene.init('canvas-container');
      } else {
        console.warn("Three.js or AstroScene initializing...");
      }
    });
  </script>

  <!-- Star Background -->
  <script>
  function createStarField() {
    const container = document.getElementById('star-field');

    if (!container) return;

    const starCount = 350;

    for (let i = 0; i < starCount; i++) {
      const star = document.createElement('div');

      star.className = 'star';

      if (Math.random() < 0.08) {
        star.classList.add('large');
      }

      star.style.left = `${Math.random() * 100}%`;
      star.style.top = `${Math.random() * 100}%`;

      star.style.setProperty(
        '--twinkle-duration',
        `${3 + Math.random() * 6}s`
      );

      star.style.setProperty(
        '--twinkle-delay',
        `${Math.random() * 6}s`
      );

      /* Slight depth variation */
      const depth = 0.5 + Math.random() * 1.5;

      star.style.transform = `scale(${depth})`;

      container.appendChild(star);
    }
  }

  document.addEventListener('DOMContentLoaded', createStarField);
</script>
</body>
</html>
